<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nozz's Typing Game</title>

  <style>

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #111111, #1c1c1c, #2a2a2a);
      color: white;
      overflow-x: hidden;
    }

    .container {
      margin-top: 40px;
    }

    h1 {
      font-size: 60px;
      color: #00ff88;
      text-shadow: 0 0 15px #00ff88, 0 0 30px #00ff88;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 22px;
      color: #cccccc;
      margin-bottom: 35px;
    }

    #word {
      font-size: 65px;
      margin: 40px 0;
      color: white;
      text-shadow: 0 0 15px rgba(0,255,136,0.9);
      min-height: 80px;
    }

    input {
      width: 360px;
      padding: 16px;
      font-size: 28px;
      text-align: center;
      border-radius: 15px;
      border: 2px solid #00ff88;
      outline: none;
      background: #111;
      color: white;
      box-shadow: 0 0 20px rgba(0,255,136,0.4);
    }

    input::placeholder {
      color: #888;
    }

    button {
      margin-top: 20px;
      margin-left: 8px;
      margin-right: 8px;
      padding: 14px 28px;
      font-size: 22px;
      border: none;
      border-radius: 15px;
      background: linear-gradient(90deg, #00ff88, #00cc66);
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 0 20px rgba(0,255,136,0.4);
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(0,255,136,0.8);
    }

    #result {
      margin-top: 35px;
      font-size: 30px;
      min-height: 80px;
      color: white;
    }

    #leaderboard {
      width: 430px;
      margin: 50px auto;
      padding: 25px;
      border-radius: 20px;
      background: rgba(255,255,255,0.05);
      border: 2px solid #00ff88;
      box-shadow: 0 0 25px rgba(0,255,136,0.25);
    }

    #leaderboard h2 {
      font-size: 36px;
      color: #00ff88;
      margin-top: 0;
      text-shadow: 0 0 10px rgba(0,255,136,0.7);
    }

    ol {
      text-align: left;
      padding-left: 35px;
      font-size: 24px;
    }

    li {
      margin: 12px 0;
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>⚡ Nozz's Typing Game ⚡</h1>

    <div class="subtitle">
      Type the words as fast as possible!
    </div>

    <div id="word">
      Press Start
    </div>

    <input
      type="text"
      id="input"
      placeholder="Start typing..."
      disabled
    />

    <br>

    <button onclick="startGame()">
      Start Typing
    </button>

    <button onclick="resetLeaderboard()">
      Reset Leaderboard
    </button>

    <div id="result"></div>

    <div id="leaderboard">

      <h2>🏁 Fastest Typers</h2>

      <ol id="scores"></ol>

    </div>

  </div>

  <script type="module">

    import { createClient }
    from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    // =========================
    // SUPABASE
    // =========================

    const supabaseUrl =
      'https://yblaroojefeqhkccxzoz.supabase.co'

    const supabaseKey =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlibGFyb29qZWZlcWhrY2N4em96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0ODI4MjEsImV4cCI6MjA5NDA1ODgyMX0.lPrqaw2w7qHBouaBbm5f594n0CihHOWcvmc0BYjCBGc'

    const supabase =
      createClient(
        supabaseUrl,
        supabaseKey
      )

    // =========================
    // WORD LIST
    // =========================

"about","above","across","action","active","actual","advice","afraid","afternoon","against","airport","already","amazing","another","answer","anybody","apartment","apology","appears","applied","arrange","arrival","article","artists","aspects","assume","athlete","attempt","attention","attract","average","backpack","balance","balloon","bananas","barrier","battery","because","bedroom","believe","beneath","benefit","between","bicycle","blanket","blessing","border","bother","bottles","builder","business","cabinet","capture","careful","carrier","cartoon","catalog","ceiling","central","century","certain","chamber","channel","chapter","charity","cheaper","chicken","choices","citizen","classic","climate","closely","clothes","collect","college","combine","comfort","command","comment","company","compare","compete","complex","concept","concern","concert","conduct","confirm","connect","consist","contact","contain","content","control","cookies","correct","costume","cottage","courage","covered","crashes","creator","crystal","culture","curious","current","curtain","customs","cutting","damage","dancing","danger","daytime","decided","decline","default","defense","delight","deliver","density","deposit","deserve","desktop","details","develop","diamond","digital","dinner","discuss","disease","display","distance","district","diverse","doctor","dollars","dominate","drawing","drivers","dynamic","earlier","earnest","eastern","economy","edition","effects","efforts","elderly","element","embrace","emotion","emperor","employs","enabled","encounter","endless","enhance","enough","episode","equally","escaped","essence","evening","exactly","example","excited","exclude","exhibit","explore","express","factory","failure","famous","fantasy","farmers","fashion","feature","federal","feeling","fiction","fifteen","fighter","finally","finding","fishing","fitness","flowers","focused","forever","forgive","fortune","forward","freedom","friends","further","gallery","garbage","gateway","general","genius","gesture","glasses","greater","grocery","growing","habitat","handful","happens","harvest","heading","healthy","hearing","helpful","herself","highway","history","holiday","honesty","however","hundred","husband","imagine","improve","include","initial","insects","instant","instead","intense","interest","journey","justice","kitchen","knowing","largest","lasting","leading","learned","leisure","library","limited","logical","machine","manager","markets","married","massive","maximum","measure","medical","meeting","message","million","mineral","minimum","miracle","mission","mistake","mixture","monitor","morning","musical","mystery","natural","neither","nervous","network","nothing","nuclear","numbers","observe","obvious","officer","opening","operate","opinion","opposed","organic","outcome","outside","overall","package","painful","parking","partner","passage","passion","payment","penalty","pencils","perform","perhaps","phoenix","physics","picture","pioneer","plastic","platform","pleased","pockets","popular","portion","poverty","precise","predict","premium","prepare","present","prevent","primary","printer","privacy","problem","process","produce","profile","program","project","promise","promote","protect","protein","provide","publish","purpose","pushing","quality","quarter","quickly","railway","reading","reality","receive","recover","reflect","regular","related","release","remains","removal","replace","request","require","reserve","resolve","respect","respond","results","retired","reveals","reverse","routine","running","satisfy","science","section","segment","serious","service","session","setting","several","sharing","shortly","showing","silence","similar","sincere","slightly","society","soldier","somehow","someone","speaker","special","station","storage","strange","stretch","student","subject","success","suggest","support","suppose","surface","survive","teacher","television","telling","terrace","texture","theater","therapy","thought","through","tonight","towards","traffic","travels"," neighbor","nominate","normally","notebook","nutrient","occasion","official","operator","ordinary","organize","original","painting","parallel","patience","personal","physical","planning","pleasant","pleasure","position","positive","powerful","practice","presence","pressure","priority","producer","progress","property","proposal","prospect","protocol","purchase","question","reaction","receiver","recovery","regional","register","relation","reliable","remember","research","resource","response","restaurant","romantic","sandwich","schedule","security","separate","shoulder","software","solution","southern","speaking","specific","strategy","strength","structure","sunshine","surprise","surround","swimming","symbolic","teaching","together","tomorrow","training","treasury","triangle","ultimate","universe","valuable","vacation","vertical","violence","wireless","wonderful","workshop","yourself","absolute","academic","accepted","accident","adoption","adventure","aircraft","alliance","announce","anything","approach","approval","argument","arrangement","assistant","attached","audience","available","awareness","baseball","basement","bathroom","beautiful","beginner","breakfast","breathing","broadcast","cafeteria","calculated","candidate","carefully","celebrity","character","chemistry","chocolate","civilian","classroom","collision","community","complaint","completed","component","condition","conference","connected","conscious","container","continued","corporate","countryside","creature","criticism","dangerous","dedicated","democracy","dependent","described","different","direction","disappear","discovery","discussion","efficient","elections","emergency","emotional","emphasize","equipment","essential","excellent","expansion","experience","financial","foundation","friendship","government","happiness","important","impossible","independent","influence","investment","knowledge","leadership","literature","management","marketing","membership","motivation","newspaper","operations","opportunity","particular","performance","population","preference","preparing","production","professional","protection","recognize","reduction","reputation","restaurant","scientific","selection","significant","successful","technology","traditional","understand","university","wonderfully"


    ]

    // =========================
    // VARIABLES
    // =========================

    let currentWord = ""
    let startTime = null

    const wordDisplay =
      document.getElementById("word")

    const input =
      document.getElementById("input")

    const result =
      document.getElementById("result")

    const scoresList =
      document.getElementById("scores")

    // =========================
    // LOAD LEADERBOARD
    // =========================

    async function loadLeaderboard() {

      const { data, error } =

        await supabase
          .from('leaderboard')
          .select('*')
          .order('wpm', {
            ascending: false
          })
          .limit(10)

      if (error) {

        console.error(error)

        return
      }

      scoresList.innerHTML = ""

      data.forEach((entry, index) => {

        const li =
          document.createElement("li")

        li.textContent =
          `${index + 1}. ${entry.name} — ${entry.wpm} WPM`

        scoresList.appendChild(li)
      })
    }

    // =========================
    // SAVE SCORE
    // =========================

    async function saveScore(name, wpm) {

      const { error } =

        await supabase
          .from('leaderboard')
          .insert([
            {
              name: name,
              wpm: wpm
            }
          ])

      if (error) {

        console.error(error)

        return
      }

      loadLeaderboard()
    }

    // =========================
    // START GAME
    // =========================

    window.startGame = function () {

      currentWord =

        words[
          Math.floor(Math.random() * words.length)
        ]

      wordDisplay.textContent =
        currentWord

      input.value = ""

      input.disabled = false

      input.focus()

      result.innerHTML = ""

      startTime = null
    }

    // =========================
    // INPUT DETECTION
    // =========================

    input.addEventListener("input", () => {

      if (
        startTime === null &&
        input.value.length > 0
      ) {

        startTime =
          new Date().getTime()
      }

      if (input.value === currentWord) {

        const endTime =
          new Date().getTime()

        const timeTaken =
          (endTime - startTime) / 1000

        const wpm =
          Math.round((1 / timeTaken) * 60)

        result.innerHTML = `
          ✅ PERFECT RUN<br>
          ⏱ ${timeTaken.toFixed(2)} Seconds<br>
          ⚡ ${wpm} WPM
        `

        input.disabled = true

        let name = prompt(
          "🏁 Enter your rider name:"
        )

        if (!name || name.trim() === "") {

          name = "Anonymous"
        }

        saveScore(name, wpm)
      }
    })

    // =========================
    // RESET LEADERBOARD
    // =========================

    window.resetLeaderboard =
      async function () {

      const password = prompt(
        "Enter admin password:"
      )

      if (password !== "nozz123") {

        alert("Wrong password")

        return
      }

      const { error } =

        await supabase
          .from('leaderboard')
          .delete()
          .neq('id', 0)

      if (error) {

        console.error(error)

        return
      }

      loadLeaderboard()

      alert("🏁 Leaderboard Reset!")
    }

    // =========================
    // LOAD LEADERBOARD ON OPEN
    // =========================

    loadLeaderboard()

  </script>

</body>
</html>
